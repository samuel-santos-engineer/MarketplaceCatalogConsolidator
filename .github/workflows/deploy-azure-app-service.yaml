name: Deploy immutable container to Azure App Service

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Resource group to create in West Central US
        required: true
        default: rg-marketplace-catalog-wcus
      plan_name:
        description: Linux F1 App Service plan name
        required: true
        default: plan-marketplace-catalog-f1-wcus
      app_name:
        description: Globally unique App Service web app name
        required: true
        default: marketplace-catalog-consolidator-ss-wcus
      confirm_f1:
        description: Confirm deployment must remain Linux F1 in West Central US
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: azure-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_f1
    runs-on: ubuntu-latest
    env:
      REGION: westcentralus
      SKU: F1
      PACKAGE_NAME: marketplace-catalog-consolidator
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/marketplace-catalog-consolidator
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      PLAN_NAME: ${{ inputs.plan_name }}
      APP_NAME: ${{ inputs.app_name }}
      PRODUCTION_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require merged main and deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$PRODUCTION_API_KEY"
          test "${{ inputs.confirm_f1 }}" = "true"

      - name: Check out immutable source
        uses: actions/checkout@v5

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Reconfirm Linux F1 region capability
        shell: bash
        run: |
          set -euo pipefail
          az appservice list-locations --sku "$SKU" --linux-workers-enabled \
            --query "[?name=='West Central US'].name | [0]" --output tsv | grep -Fx "West Central US"

      - name: Verify web app name availability
        shell: bash
        run: |
          set -euo pipefail
          subscription_id="$(az account show --query id --output tsv)"
          available="$(az rest --method post \
            --url "https://management.azure.com/subscriptions/$subscription_id/providers/Microsoft.Web/checknameavailability?api-version=2024-04-01" \
            --headers Content-Type=application/json \
            --body "{\"name\":\"$APP_NAME\",\"type\":\"Microsoft.Web/sites\"}" \
            --query nameAvailable --output tsv)"
          test "$available" = "true"

      - name: Refuse to modify pre-existing deployment resources
        shell: bash
        run: |
          set -euo pipefail
          test "$(az group exists --name "$RESOURCE_GROUP")" = "false"
          test "$(az webapp list --query "[?name=='$APP_NAME'] | length(@)" --output tsv)" = "0"

      - name: Build and publish full-SHA image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker build --file Dockerfile --tag "$IMAGE_REPOSITORY:$GITHUB_SHA" .
          docker push "$IMAGE_REPOSITORY:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Make GHCR package public and prove anonymous pull
        shell: bash
        run: |
          set -euo pipefail
          owner_type="$(gh api "/users/${{ github.repository_owner }}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            gh api --method PATCH "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME" -f visibility=public >/dev/null
          else
            gh api --method PATCH "/user/packages/container/$PACKAGE_NAME" -f visibility=public >/dev/null
          fi
          docker logout ghcr.io
          docker pull "${{ steps.image.outputs.reference }}"

      - name: Create minimum F1 App Service resources
        shell: bash
        run: |
          set -euo pipefail
          az group create --name "$RESOURCE_GROUP" --location "$REGION" --output none
          az appservice plan create --name "$PLAN_NAME" --resource-group "$RESOURCE_GROUP" \
            --location "$REGION" --sku "$SKU" --is-linux --output none
          az webapp create --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --plan "$PLAN_NAME" \
            --container-image-name "${{ steps.image.outputs.reference }}" --output none
          az webapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --https-only true --output none
          az webapp config appsettings set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --output none --settings \
            ASPNETCORE_ENVIRONMENT=Production \
            ASPNETCORE_HTTP_PORTS=8080 \
            WEBSITES_PORT=8080 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
            Catalog__StorageRoot=/home/data \
            Security__ApiKey="$PRODUCTION_API_KEY"

      - name: Verify digest pin and persistent storage configuration
        shell: bash
        run: |
          set -euo pipefail
          configured="$(az resource show --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.Web/sites/config \
            --name "$APP_NAME/web" --query properties.linuxFxVersion --output tsv)"
          test "$configured" = "DOCKER|${{ steps.image.outputs.reference }}"
          storage="$(az webapp config appsettings list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='Catalog__StorageRoot'].value | [0]" --output tsv)"
          test "$storage" = "/home/data"

      - name: Validate live app and persistence across restart
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://$APP_NAME.azurewebsites.net"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$base_url/api/v1/ready" | jq -e '.status == "ready"' >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 10
          done
          curl --fail --silent --show-error "$base_url/" | grep -F "Marketplace Catalog" >/dev/null
          curl --fail --silent --show-error "$base_url/swagger/" | grep -F "Swagger" >/dev/null
          curl --fail --silent --show-error "$base_url/api/v1/health" | jq -e '.status == "healthy"' >/dev/null
          idempotency_key="$(curl --fail --silent --show-error "$base_url/api/v2/random-uuid" | jq -r .uuid)"
          upload_id="$(curl --fail --silent --show-error --request POST "$base_url/api/v1/uploads" \
            --header "X-Api-Key: $PRODUCTION_API_KEY" --header "Idempotency-Key: $idempotency_key" \
            --form "file=@artifacts/ProductEntry.json;type=application/json" | jq -r .uploadId)"
          test -n "$upload_id"
          for attempt in $(seq 1 60); do
            status="$(curl --fail --silent --show-error "$base_url/api/v1/uploads/$upload_id/status")"
            if jq -e '.upload.reportAvailable == true' >/dev/null <<<"$status"; then break; fi
            test "$attempt" -lt 60
            sleep 10
          done
          curl --fail --silent --show-error "$base_url/api/v1/uploads/$upload_id/report" | jq -e '.summary.received == (.summary.approved + .summary.cleaned + .summary.rejected)' >/dev/null
          az webapp restart --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$base_url/api/v1/uploads/$upload_id/status" | jq -e '.upload.reportAvailable == true' >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 10
          done
          curl --fail --silent --show-error "$base_url/api/v1/uploads/$upload_id/report" | jq -e --arg id "$upload_id" '.uploadId == $id' >/dev/null
          echo "Validated $base_url with image ${{ steps.image.outputs.reference }}"